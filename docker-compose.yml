services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intentguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "IntentGuard API"
      APP_ENV: production
      APP_KEY: base64:intentguardmastersecretkeychangeinproduction=
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: intentguard
      DB_USERNAME: intentguard
      DB_PASSWORD: intentguard_secret
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYPAL_MODE: sandbox
      SANCTUM_STATEFUL_DOMAINS: "localhost:3000,localhost:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - intentguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intentguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    depends_on:
      - backend
    networks:
      - intentguard-net

  mysql:
    image: mysql:8.0
    container_name: intentguard-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: intentguard
      MYSQL_USER: intentguard
      MYSQL_PASSWORD: intentguard_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - intentguard-net

  redis:
    image: redis:7-alpine
    container_name: intentguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - intentguard-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  intentguard-net:
    driver: bridge
